[project]
name = "polish"
version = "0.1.0"
description = "Research toolkit for improving local language-model writing"
readme = "README.md"
authors = [
    { name = "Nick Russo", email = "nijaru7@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
polish = "polish.cli:main"

[project.optional-dependencies]
local-mlx = [
    "mlx-lm>=0.31.3",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "ty>=0.0.58",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
